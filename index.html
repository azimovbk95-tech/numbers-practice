<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mic Test</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
    #speakBtn {
      font-size: 1.5rem;
      padding: 20px 40px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #speakBtn:active { background: #d32f2f; }
    #feedback { margin-top: 20px; font-size: 1.3rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎤 Hold to Speak</h1>
  <button id="speakBtn">Hold to Speak</button>
  <div id="feedback"></div>

  <script>
    const feedback = document.getElementById("feedback");
    const speakBtn = document.getElementById("speakBtn");

    function startRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      feedback.textContent = "🎤 Listening...";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        feedback.textContent = "✅ You said: " + transcript;
      };

      recognition.onerror = (event) => {
        feedback.textContent = "❌ Error: " + event.error;
      };

      recognition.onend = () => {
        if (feedback.textContent === "🎤 Listening...") {
          feedback.textContent = "(No speech detected)";
        }
      };

      recognition.start();
      return recognition;
    }

    let recognitionInstance = null;

    speakBtn.addEventListener("mousedown", () => {
      recognitionInstance = startRecognition();
    });

    speakBtn.addEventListener("mouseup", () => {
      if (recognitionInstance) recognitionInstance.stop();
    });
  </script>
</body>
</html>
